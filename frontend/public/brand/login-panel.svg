<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <!-- Decorative illustration for the login brand pane: a shopping basket, a price tag and price charts. -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d6e7f7" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#e8f1fa" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fbef0" stop-opacity="0.45" />
      <stop offset="1" stop-color="#7fbef0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="300" cy="210" r="190" fill="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <path d="M40 330H520" />
    <path d="M40 260H520" stroke-dasharray="4 10" />
    <path d="M40 190H520" stroke-dasharray="4 10" />
    <path d="M40 120H520" stroke-dasharray="4 10" />
  </g>

  <!-- Bars -->
  <g fill="url(#bar)">
    <rect x="58" y="252" width="38" height="78" rx="10" />
    <rect x="112" y="222" width="38" height="108" rx="10" />
    <rect x="166" y="236" width="38" height="94" rx="10" />
    <rect x="220" y="190" width="38" height="140" rx="10" />
    <rect x="274" y="164" width="38" height="166" rx="10" />
  </g>

  <!-- Trend line -->
  <path d="M77 222L131 186L185 200L239 150L293 118L360 84" stroke="#a8d4fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <g fill="#ffffff" stroke="#2070b8" stroke-width="4">
    <circle cx="77" cy="222" r="8" />
    <circle cx="131" cy="186" r="8" />
    <circle cx="185" cy="200" r="8" />
    <circle cx="239" cy="150" r="8" />
    <circle cx="293" cy="118" r="8" />
  </g>
  <circle cx="360" cy="84" r="13" fill="#ffffff" />
  <circle cx="360" cy="84" r="6" fill="#2070b8" />

  <!-- Floating stat card -->
  <g transform="translate(376 26)">
    <rect width="150" height="74" rx="16" fill="url(#card)" />
    <rect x="14" y="16" width="42" height="42" rx="12" fill="#2070b8" />
    <path d="M25 44l8-8 6 5 9-11" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M42 30h6v6" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="68" y="22" width="62" height="10" rx="5" fill="#14487c" fill-opacity="0.85" />
    <rect x="68" y="42" width="44" height="8" rx="4" fill="#14487c" fill-opacity="0.35" />
  </g>

  <!-- Basket contents -->
  <g>
    <!-- bottle -->
    <rect x="352" y="168" width="36" height="96" rx="12" fill="#7fbef0" />
    <rect x="362" y="146" width="16" height="28" rx="5" fill="#7fbef0" />
    <rect x="360" y="138" width="20" height="12" rx="4" fill="#ffffff" />
    <rect x="352" y="198" width="36" height="28" fill="#ffffff" fill-opacity="0.85" />
    <!-- carton -->
    <path d="M398 190l18-22h40l-8 22z" fill="#cfe4f6" />
    <rect x="398" y="190" width="50" height="76" rx="4" fill="#ffffff" />
    <rect x="408" y="212" width="30" height="22" rx="4" fill="#2070b8" fill-opacity="0.85" />
    <!-- bread -->
    <ellipse cx="470" cy="226" rx="44" ry="26" fill="#f2c98a" />
    <path d="M448 214c6 6 6 18 0 24M468 208c6 8 6 26 0 34M488 212c6 6 6 20 0 26" stroke="#d9a35c" stroke-width="4" stroke-linecap="round" />
    <!-- apple -->
    <circle cx="330" cy="240" r="24" fill="#ef8a7d" />
    <path d="M330 216c2-10 8-14 16-14-1 8-6 13-16 14z" fill="#7fd1a6" />
  </g>

  <!-- Basket -->
  <path d="M290 268c26-50 64-74 126-74s100 24 126 74" stroke="#ffffff" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round" />
  <path d="M296 252h240l-24 104a18 18 0 0 1-17.5 14H337.5A18 18 0 0 1 320 356z" fill="url(#basket)" />
  <path d="M284 252h264" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <g stroke="#2070b8" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
    <path d="M356 276l6 76" />
    <path d="M396 276l2 76" />
    <path d="M436 276l-2 76" />
    <path d="M476 276l-6 76" />
  </g>
  <path d="M310 300h212M318 330h196" stroke="#2070b8" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round" />

  <!-- Price tag -->
  <g transform="translate(210 262) rotate(-14)">
    <path d="M0 18L18 0h72a10 10 0 0 1 10 10v48a10 10 0 0 1-10 10H18L0 50z" fill="#ffffff" />
    <circle cx="20" cy="34" r="6" fill="#2070b8" fill-opacity="0.3" />
    <text x="62" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans Variable', system-ui, sans-serif" font-size="34" font-weight="800" fill="#14487c">$</text>
  </g>
  <path d="M300 262c-20-6-44 0-62 14" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round" />
</svg>
